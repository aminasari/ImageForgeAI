<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ImageForgeAI</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b0f19;
  color:#f5f7ff;
}

.container{
  width:min(720px,94%);
  margin:auto;
  padding:25px 0 50px;
}

h1{
  text-align:center;
  margin:10px 0 5px;
  font-size:32px;
}

.subtitle{
  text-align:center;
  color:#9ca7bd;
  margin-bottom:28px;
}

.card{
  background:#121827;
  border:1px solid #303a50;
  border-radius:18px;
  padding:20px;
  margin-bottom:18px;
}

label{
  display:block;
  font-weight:bold;
  font-size:17px;
  margin-bottom:9px;
}

textarea,
select,
input[type="file"]{
  width:100%;
  background:#171e2e;
  color:white;
  border:1px solid #3b465d;
  border-radius:13px;
  padding:14px;
  font-size:16px;
}

textarea{
  min-height:150px;
  resize:vertical;
}

select{
  appearance:auto;
}

button{
  width:100%;
  border:0;
  border-radius:14px;
  padding:16px;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

.generate{
  background:#604cff;
  color:white;
  margin-top:8px;
}

.generate:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.secondary{
  background:#242d40;
  color:white;
  margin-top:10px;
}

.status{
  margin-top:20px;
  padding:16px;
  border-radius:13px;
  background:#101827;
  border:1px dashed #3d4960;
  text-align:center;
  color:#aab5ca;
  line-height:1.5;
}

.result{
  margin-top:20px;
  text-align:center;
}

.result img{
  max-width:100%;
  border-radius:16px;
  display:block;
  margin:auto;
}

.download{
  display:block;
  margin-top:12px;
  background:#263248;
  color:white;
  text-decoration:none;
  padding:14px;
  border-radius:12px;
  font-weight:bold;
}

.preview{
  margin-top:12px;
  max-width:100%;
  max-height:400px;
  border-radius:14px;
  display:none;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.small{
  color:#8995ac;
  font-size:13px;
  margin-top:7px;
}

.footer{
  text-align:center;
  color:#69758c;
  margin-top:30px;
}
</style>
</head>

<body>

<div class="container">

<h1>✨ ImageForgeAI</h1>

<div class="subtitle">
Text-to-Image & Image-to-Image
</div>

<div class="card">

<label for="prompt">Deskripsi gambar</label>

<textarea id="prompt"
placeholder="Contoh: wanita cantik memakai pakaian tradisional China, berdiri di desa China, cinematic, highly detailed..."></textarea>

<div class="small">
Jelaskan gambar yang ingin dibuat sedetail mungkin.
</div>

</div>

<div class="card">

<label for="ratio">Rasio</label>

<select id="ratio">

<option value="9:16">9:16 — Portrait</option>
<option value="1:1">1:1 — Square</option>
<option value="16:9">16:9 — Landscape</option>

</select>

</div>

<div class="card">

<label for="quality">Kualitas</label>

<select id="quality">

<option value="standard">Standard</option>
<option value="high" selected>High</option>

</select>

</div>

<div class="card">

<label for="reference">
Gambar referensi — opsional
</label>

<input
  type="file"
  id="reference"
  accept="image/*"
>

<img
  id="preview"
  class="preview"
  alt="Preview"
>

<div class="small">
Pilih foto jika ingin menggunakan Image-to-Image.
</div>

</div>

<button
  id="generateButton"
  class="generate"
>
✨ Generate Image
</button>

<div id="status" class="status">
Siap membuat gambar.
</div>

<div id="result" class="result"></div>

<div class="footer">
ImageForgeAI © 2026
</div>

</div>

<script>

/* ==========================================
   IMAGEFORGEAI
   AI HORDE FREE IMAGE GENERATOR
========================================== */

const API_URL =
"https://aihorde.net/api/v2/generate/async";

const STATUS_URL =
"https://aihorde.net/api/v2/generate/status/";

const API_KEY =
"0000000000";

const CLIENT_AGENT =
"ImageForgeAI:1.0:aminasari";

/* ELEMENTS */

const promptInput =
document.getElementById("prompt");

const ratioInput =
document.getElementById("ratio");

const qualityInput =
document.getElementById("quality");

const referenceInput =
document.getElementById("reference");

const preview =
document.getElementById("preview");

const generateButton =
document.getElementById("generateButton");

const statusBox =
document.getElementById("status");

const resultBox =
document.getElementById("result");


/* ==========================================
   PREVIEW FOTO
========================================== */

referenceInput.addEventListener(
"change",
function(){

  const file =
  referenceInput.files[0];

  if(!file){
    preview.style.display="none";
    return;
  }

  const url =
  URL.createObjectURL(file);

  preview.src=url;

  preview.style.display="block";

});


/* ==========================================
   RASIO
========================================== */

function getDimensions(){

  const ratio =
  ratioInput.value;

  if(ratio === "1:1"){
    return {
      width:768,
      height:768
    };
  }

  if(ratio === "16:9"){
    return {
      width:1024,
      height:576
    };
  }

  return {
    width:576,
    height:1024
  };

}


/* ==========================================
   FILE -> BASE64
========================================== */

function fileToBase64(file){

  return new Promise(
    (resolve,reject)=>{

      const reader =
      new FileReader();

      reader.onload=()=>{
        resolve(
          reader.result.split(",")[1]
        );
      };

      reader.onerror=reject;

      reader.readAsDataURL(file);

    }
  );

}


/* ==========================================
   CREATE REQUEST
========================================== */

async function createGeneration(){

  const prompt =
  promptInput.value.trim();

  if(!prompt){

    alert(
      "Silakan masukkan deskripsi gambar terlebih dahulu."
    );

    return null;
  }

  const dimensions =
  getDimensions();

  let finalPrompt =
  prompt;

  let sourceImage =
  null;

  const file =
  referenceInput.files[0];

  /*
    Jika ada foto referensi,
    gunakan mode Image-to-Image.
  */

  if(file){

    statusBox.innerText =
    "📷 Membaca gambar referensi...";

    sourceImage =
    await fileToBase64(file);

  }


  /*
    Kualitas High menggunakan
    langkah lebih banyak.
  */

  const steps =
  qualityInput.value === "high"
  ? 30
  : 20;


  const payload = {

    prompt: finalPrompt,

    params: {

      width:
      dimensions.width,

      height:
      dimensions.height,

      steps:
      steps,

      n:1,

      cfg_scale:7

    },

    models:[
      "AlbedoBase XL"
    ]

  };


  /*
    IMAGE-TO-IMAGE
  */

  if(sourceImage){

    payload.source_image =
    sourceImage;

    payload.source_processing =
    "img2img";

    payload.params.denoising_strength =
    0.65;

  }


  statusBox.innerText =
  "⏳ Mengirim permintaan ke AI Horde...";


  const response =
  await fetch(
    API_URL,
    {

      method:"POST",

      headers:{

        "Content-Type":
        "application/json",

        "apikey":
        API_KEY,

        "Client-Agent":
        CLIENT_AGENT

      },

      body:
      JSON.stringify(payload)

    }
  );


  if(!response.ok){

    const text =
    await response.text();

    throw new Error(
      "API error: " +
      response.status +
      " " +
      text
    );

  }


  return await response.json();

}


/* ==========================================
   CHECK STATUS
========================================== */

async function waitForResult(id){

  for(let i=0;i<120;i++){

    await new Promise(
      resolve =>
      setTimeout(resolve,5000)
    );

    statusBox.innerText =
    "⏳ Menunggu GPU volunteer... " +
    (i+1) +
    "/120";


    const response =
    await fetch(
      STATUS_URL + id,
      {

        headers:{
          "apikey":
          API_KEY,

          "Client-Agent":
          CLIENT_AGENT

        }

      }
    );


    if(!response.ok){

      throw new Error(
        "Gagal membaca status."
      );

    }


    const data =
    await response.json();


    if(
      data.done === true &&
      data.generations &&
      data.generations.length
    ){

      return data.generations;

    }


    if(data.faulted){

      throw new Error(
        "Server AI Horde mengalami masalah."
      );

    }

  }


  throw new Error(
    "Waktu tunggu terlalu lama. Coba lagi."
  );

}


/* ==========================================
   GENERATE
========================================== */

generateButton.addEventListener(
"click",
async function(){

  generateButton.disabled =
  true;

  resultBox.innerHTML="";

  statusBox.innerText =
  "🚀 Memulai generator...";


  try{

    const job =
    await createGeneration();


    if(!job || !job.id){

      throw new Error(
        "ID pekerjaan tidak diterima."
      );

    }


    statusBox.innerText =
    "🧠 Gambar sedang diproses...";


    const generations =
    await waitForResult(
      job.id
    );


    if(
      !generations ||
      !generations.length
    ){

      throw new Error(
        "Gambar tidak ditemukan."
      );

    }


    const generation =
    generations[0];


    let imageUrl =
    generation.img;


    /*
      Jika API mengembalikan
      URL gambar langsung.
    */

    if(!imageUrl){

      throw new Error(
        "URL gambar tidak tersedia."
      );

    }


    statusBox.innerText =
    "✅ Gambar berhasil dibuat!";


    resultBox.innerHTML = `

      <img
        src="${imageUrl}"
        alt="AI Generated Image"
      >

      <a
        class="download"
        href="${imageUrl}"
        target="_blank"
        rel="noopener"
      >
        ⬇️ Buka / Simpan Gambar
      </a>

    `;


  }catch(error){

    console.error(error);

    statusBox.innerText =
    "❌ Gagal membuat gambar.\n\n" +
    error.message;

  }finally{

    generateButton.disabled =
    false;

  }

});

</script>

</body>
</html>
